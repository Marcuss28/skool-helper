<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Skool Helper</title>
<style>
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #111827;
    color: #e5e7eb;
    margin: 0;
    padding: 14px 16px;
    width: 260px;
  }
  h1 { font-size: 14px; margin: 0 0 6px; color: #fbbf24; }
  p { font-size: 12px; color: #9ca3af; margin: 0 0 12px; line-height: 1.4; }
  button {
    width: 100%;
    background: #f59e0b;
    color: #1f2937;
    border: 0;
    border-radius: 8px;
    padding: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 6px;
  }
  button.secondary {
    background: #374151;
    color: #e5e7eb;
    font-weight: 500;
  }
  button:hover { opacity: 0.9; }
</style>
</head>
<body>
  <h1>Skool Helper</h1>
  <p>Heb relevante Skool-Posts hervor. Jede Interaktion bleibt manuell.</p>
  <button id="open-options">Einstellungen öffnen</button>
  <button id="toggle-sidebar" class="secondary">Sidebar umschalten</button>
  <script src="popup.js"></script>
</body>
</html>
